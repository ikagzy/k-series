# Publishing a new K-Series / K-Optimizer version:
#   git tag v1.1.0
#   git push origin v1.1.0
# GitHub builds K-Series.exe and K-Optimizer.exe on a clean Windows machine and attaches them (plus their
# SHA-256 files) to a release. K-Series then offers the update to everyone who has it installed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        shell: pwsh
        run: pip install -r requirements.txt

      - name: Stamp the version from the tag (v1.1.0 -> 1.1.0)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Tag '$version' is not a version number" }
          foreach ($f in "src/k_series/__init__.py", "src/k_optimizer/__init__.py") {
            (Get-Content $f) -replace '__version__ = ".*"', "__version__ = `"$version`"" | Set-Content $f -Encoding utf8
          }

      - name: Test
        shell: pwsh
        run: |
          $out = python -m pytest -q --tb=line 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # the GUI tests are timing based and a shared runner can be slow: run only the failed ones once more
            $out += "`n--- second try of the failed tests ---`n"
            $out += python -m pytest -q --tb=line --lf 2>&1 | Out-String
            $code = $LASTEXITCODE
          }
          $out
          if ($code -ne 0) {
            $lines = $out -split "`n" | Where-Object { $_.Trim() } | Select-Object -Last 8
            foreach ($l in $lines) { "::error title=pytest::$($l.Trim())" }
            exit $code
          }

      - name: Build executables
        shell: pwsh
        run: |
          $common = @("--noconfirm", "--onefile", "--noconsole", "--paths", "src",
                      "--add-data", "src/k_optimizer/assets;k_optimizer/assets",
                      "--add-data", "src/k_optimizer/data;k_optimizer/data")
          # embed the version in each exe: K-Series reads it to tell which K-Optimizer is installed
          python tools/make_version.py k_series "K-Series" "K-Series.exe" build/version_kseries.txt
          python tools/make_version.py k_optimizer "K-Optimizer" "K-Optimizer.exe" build/version_koptimizer.txt
          python -m PyInstaller @common --icon src/k_optimizer/assets/AppIcons/ks/amber-orange.ico --version-file build/version_kseries.txt --name K-Series kseries_launcher.py
          python -m PyInstaller @common --icon src/k_optimizer/assets/AppIcons/ko/amber-orange.ico --version-file build/version_koptimizer.txt --name K-Optimizer launcher.py
          foreach ($exe in "K-Series", "K-Optimizer") {
            $hash = (Get-FileHash "dist/$exe.exe" -Algorithm SHA256).Hash.ToLower()
            "$hash  $exe.exe" | Set-Content "dist/$exe.exe.sha256" -Encoding ascii
          }
          # one download for people who install by hand: both apps in a single zip
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "dist/K-Series-$version.zip"
          Compress-Archive -Path dist/K-Series.exe, dist/K-Optimizer.exe, LICENSE, README.md -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  K-Series-$version.zip" | Set-Content "$zip.sha256" -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/K-Series.exe
            dist/K-Series.exe.sha256
            dist/K-Optimizer.exe
            dist/K-Optimizer.exe.sha256
            dist/K-Series-*.zip
            dist/K-Series-*.zip.sha256
